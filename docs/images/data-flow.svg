<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="Inter, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1224"/>
      <stop offset="1" stop-color="#171a33"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d6af0"/>
      <stop offset="1" stop-color="#5856D6"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7aa3"/>
      <stop offset="1" stop-color="#FF5C8A"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb878"/>
      <stop offset="1" stop-color="#FFA058"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3dd68c"/>
      <stop offset="1" stop-color="#22b573"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8fb8"/>
    </marker>
  </defs>

  <rect width="1240" height="560" fill="url(#bg)"/>

  <text x="620" y="44" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">One Request, End to End</text>
  <text x="620" y="68" font-size="13" fill="#9aa0c3" text-anchor="middle">"Tap LeBron James to see his injury risk" — measured total: under 800 ms</text>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="40" y="120" width="210" height="130" rx="14" fill="#1b1e3a" stroke="#3a3f74"/>
    <circle cx="72" cy="152" r="13" fill="url(#indigo)"/>
    <text x="72" y="157" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="145" y="152" font-size="14" font-weight="700" fill="#ffffff">User taps</text>
    <text x="145" y="171" font-size="14" font-weight="700" fill="#ffffff">LeBron James</text>
    <text x="62" y="202" font-size="11.5" fill="#aab0d6">App navigates to Player Risk,</text>
    <text x="62" y="219" font-size="11.5" fill="#aab0d6">fires two requests at once:</text>
    <text x="62" y="238" font-size="11.5" fill="#8b8fb8">risk profile + 60-day history</text>
  </g>

  <line x1="250" y1="185" x2="318" y2="185" stroke="#8b8fb8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="326" y="120" width="210" height="130" rx="14" fill="#1b1e3a" stroke="#3a3f74"/>
    <circle cx="358" cy="152" r="13" fill="url(#indigo)"/>
    <text x="358" y="157" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="431" y="152" font-size="14" font-weight="700" fill="#ffffff">Backend cache</text>
    <text x="348" y="202" font-size="11.5" fill="#aab0d6">Score computed within 6h?</text>
    <text x="348" y="221" font-size="11.5" fill="#22b573">→ serve instantly (fresh)</text>
    <text x="348" y="240" font-size="11.5" fill="#ffb878">→ else recompute via ML</text>
  </g>

  <line x1="536" y1="185" x2="604" y2="185" stroke="#8b8fb8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="612" y="120" width="210" height="130" rx="14" fill="#1b1e3a" stroke="#3a3f74"/>
    <circle cx="644" cy="152" r="13" fill="url(#pink)"/>
    <text x="644" y="157" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="717" y="152" font-size="14" font-weight="700" fill="#ffffff">Python ML</text>
    <text x="634" y="202" font-size="11.5" fill="#aab0d6">z-score vs the player's</text>
    <text x="634" y="221" font-size="11.5" fill="#aab0d6">own 21-day baseline</text>
    <text x="634" y="240" font-size="11.5" fill="#8b8fb8">(minutes/distance/intensity)</text>
  </g>

  <line x1="822" y1="185" x2="890" y2="185" stroke="#8b8fb8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="898" y="120" width="300" height="130" rx="14" fill="#1b1e3a" stroke="#3a3f74"/>
    <circle cx="930" cy="152" r="13" fill="url(#green)"/>
    <text x="930" y="157" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="1003" y="152" font-size="14" font-weight="700" fill="#ffffff">Backend responds</text>
    <text x="920" y="196" font-size="11.5" fill="#aab0d6">risk score 68 · red zone · trigger "minutes"</text>
    <text x="920" y="215" font-size="11.5" fill="#aab0d6">z 2.3 · baseline 28.5 · recent 36.1</text>
    <text x="920" y="234" font-size="11.5" fill="#8b8fb8">plain-English explanation + 21 game logs</text>
  </g>

  <!-- Step 5: app renders (bottom) -->
  <line x1="620" y1="250" x2="620" y2="310" stroke="#8b8fb8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="240" y="318" width="760" height="180" rx="16" fill="#1b1e3a" stroke="#3a3f74"/>
  </g>
  <text x="620" y="348" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">App renders — display layer only, zero math on device</text>

  <g>
    <rect x="272" y="368" width="160" height="100" rx="10" fill="#222651" stroke="#3a3f74"/>
    <text x="352" y="394" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Risk circle</text>
    <text x="352" y="416" font-size="22" font-weight="800" fill="#ff5c8a" text-anchor="middle">68</text>
    <text x="352" y="438" font-size="11" fill="#ff9db8" text-anchor="middle">HIGH RISK</text>
  </g>
  <g>
    <rect x="452" y="368" width="160" height="100" rx="10" fill="#222651" stroke="#3a3f74"/>
    <text x="532" y="394" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Explanation</text>
    <text x="532" y="420" font-size="10.5" fill="#aab0d6" text-anchor="middle">"played 27% more minutes</text>
    <text x="532" y="436" font-size="10.5" fill="#aab0d6" text-anchor="middle">than personal average</text>
    <text x="532" y="452" font-size="10.5" fill="#aab0d6" text-anchor="middle">over the last 5 games"</text>
  </g>
  <g>
    <rect x="632" y="368" width="160" height="100" rx="10" fill="#222651" stroke="#3a3f74"/>
    <text x="712" y="394" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Workload chart</text>
    <polyline points="660,448 676,436 692,442 708,430 724,434 740,414 756,418 772,398" fill="none" stroke="#6d6af0" stroke-width="3"/>
    <polyline points="668,440 684,430 700,436 716,424 732,428 748,408 764,412 780,392" fill="none" stroke="#ff5c8a" stroke-width="2"/>
    <text x="712" y="462" font-size="10" fill="#8b8fb8" text-anchor="middle">minutes per game (red = spike)</text>
  </g>
  <g>
    <rect x="812" y="368" width="160" height="100" rx="10" fill="#222651" stroke="#3a3f74"/>
    <text x="892" y="394" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Trend chart</text>
    <polyline points="838,442 856,440 874,434 892,438 910,428 928,422 946,410" fill="none" stroke="#22b573" stroke-width="2.5"/>
    <text x="892" y="462" font-size="10" fill="#8b8fb8" text-anchor="middle">60-day risk history</text>
  </g>

  <!-- Footer -->
  <text x="620" y="530" font-size="11.5" fill="#8b8fb8" text-anchor="middle">If any one piece fails — ML down, API down, network gone — the other layers keep working and the user still sees something useful.</text>
</svg>
