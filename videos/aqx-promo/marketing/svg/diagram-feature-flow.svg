    <text x="770" y="510" text-anchor="middle" font-size="22" font-weight="700" fill="#6E7280">02</text>
    <text x="770" y="560" text-anchor="middle" font-size="28" font-weight="800" fill="#14121F">Home brief</text>
    <text x="770" y="600" text-anchor="middle" font-size="18" fill="#6E7280">Daily snapshot</text>

    <path d="M960 530 H1040" stroke="#5856D6" stroke-width="4"/>
