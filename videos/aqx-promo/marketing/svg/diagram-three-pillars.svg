<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Apex three pillars">
  <rect width="1920" height="1080" fill="#F0F1F5"/>
  <text x="160" y="140" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="4" fill="#5856D6">Apex Sports Intelligence</text>
  <text x="160" y="220" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#14121F">Three pillars. One brief.</text>
  <g transform="translate(160,340)">
    <rect width="500" height="520" rx="28" fill="#FFFFFF" stroke="#E4E5EC"/>
    <circle cx="80" cy="90" r="36" fill="#FDEBEC"/>
    <text x="80" y="100" text-anchor="middle" font-size="28">d</text>
    <text x="140" y="100" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#E5484D">Injury Risk</text>
    <text x="56" y="180" font-family="Inter, Arial, sans-serif" font-size="24" fill="#6E7280">Traffic-light scores,</text>
    <text x="56" y="220" font-family="Inter, Arial, sans-serif" font-size="24" fill="#6E7280">workload charts, alerts</text>
    <text x="56" y="300" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#14121F">Know whos at risk</text>
    <text x="56" y="340" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#14121F">before they get hurt.</text>
  </g>
  <g transform="translate(710,340)">
    <rect width="500" height="520" rx="28" fill="#FFFFFF" stroke="#E4E5EC"/>
    <circle cx="80" cy="90" r="36" fill="#EFEEFB"/>
    <text x="80" y="100" text-anchor="middle" font-size="28"></text>
    <text x="140" y="100" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#5856D6">Decisions</text>
    <text x="56" y="180" font-family="Inter, Arial, sans-serif" font-size="24" fill="#6E7280">EV grading, leaderboards,</text>
    <text x="56" y="220" font-family="Inter, Arial, sans-serif" font-size="24" fill="#6E7280">process vs outcome</text>
    <text x="56" y="300" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#14121F">Grade every call</text>
    <text x="56" y="340" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#14121F">on pure logic.</text>
  </g>
  <g transform="translate(1260,340)">
    <rect width="500" height="520" rx="28" fill="#FFFFFF" stroke="#E4E5EC"/>
    <circle cx="80" cy="90" r="36" fill="#FFF4DF"/>
    <text x="80" y="100" text-anchor="middle" font-size="28"></text>
    <text x="140" y="100" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#FFA058">Momentum</text>
    <text x="56" y="180" font-family="Inter, Arial, sans-serif" font-size="24" fill="#6E7280">Real / Myth verdicts,</text>
    <text x="56" y="220" font-family="Inter, Arial, sans-serif" font-size="24" fill="#6E7280">Game Replay scrubber</text>
    <text x="56" y="300" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#14121F">Is momentum real </text>
    <text x="56" y="340" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#14121F">or just a story?</text>
  </g>
</svg>
