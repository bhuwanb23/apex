name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '!backend/python_ml/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '!backend/python_ml/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # prisma.config.ts resolves DATABASE_URL via env() — required even for
    # `prisma generate`/`prisma validate`, which never touch the database. CI
    # has no .env (gitignored), so provide the same SQLite URL .env.example
    # ships; the generated client is identical regardless of the value.
    env:
      DATABASE_URL: "file:./prisma/aqx.db"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Prisma client is generated by postinstall, but validate the schema and
      # force a fresh generate so a schema-only change can never slip through.
      - name: Prisma generate & validate
        run: |
          npm run db:generate
          npx prisma validate
